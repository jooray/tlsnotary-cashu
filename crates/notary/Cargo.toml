[package]
name = "tlsnc-notary"
description = "TLSNotary notary that signs attestations, paid per session with Cashu"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tlsnc-notary"
path = "src/main.rs"

[dependencies]
tlsnc-protocol = { workspace = true }
tlsn = { workspace = true, features = ["mozilla-certs"] }
cdk = { workspace = true }
cdk-sqlite = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hickory-resolver = "0.26"
ipnet = "2"
k256 = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tlsnc-client = { workspace = true }
tlsnc-verify = { workspace = true }
tokio-tungstenite = { workspace = true }
