[package]
name = "tlsnc-client"
description = "Prover side of tlsnotary-cashu: notarize an HTTPS request, build presentations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tlsnc-protocol = { workspace = true }
tlsn = { workspace = true, features = ["mozilla-certs"] }
tlsn-formats = { workspace = true }

bincode = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
pin-project-lite = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tlsn = { workspace = true, features = ["mozilla-certs", "web"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
