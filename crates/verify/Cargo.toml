[package]
name = "tlsnc-verify"
description = "Verify tlsnotary-cashu presentations against pinned notary keys"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tlsnc-protocol = { workspace = true }
tlsn-attestation = { workspace = true }
tlsn-core = { workspace = true, features = ["mozilla-certs"] }
bincode = { workspace = true }
hex = { workspace = true }
rangeset = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
