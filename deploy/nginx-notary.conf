# /etc/nginx/conf.d/notary.conf: the notary API and the web app on one name.
#
# Replace notary.example.org (server_name, certificate paths) and
# /var/www/notary with yours; deploy/deploy.sh does that for you. Tickets
# never appear in URLs (they travel as a WebSocket subprotocol), and the
# access log drops query strings on the API anyway.

log_format tlsnc_noargs '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" $request_time';

limit_req_zone $binary_remote_addr zone=tlsnc_tickets:10m rate=30r/m;

upstream tlsnc_notary {
    server unix:/run/tlsnc/notary.sock;
}

map $http_upgrade $tlsnc_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name notary.example.org;
    # certbot --webroot needs this; with certbot --nginx it is not used.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name notary.example.org;

    ssl_certificate /etc/letsencrypt/live/notary.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notary.example.org/privkey.pem;

    access_log /var/log/nginx/notary.access.log tlsnc_noargs;
    # /app/   the web app, a PWA (apps/demo)
    # /dl/    optional: tlsnc binaries for your users
    root /var/www/notary;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json;

    # add_header in a location discards the inherited ones, so every
    # location that adds a header repeats them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        return 302 /app/;
    }

    location /dl/ {
        default_type application/octet-stream;
        types { }
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # `types` maps extensions, and SHA256SUMS has none.
    location = /dl/SHA256SUMS {
        default_type text/plain;
        types { }
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The web app must be cross-origin isolated: the WASM prover uses threads.
    set $coop "same-origin";
    set $coep "require-corp";

    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /app/tlsnc-wasm/ {
        types { application/wasm wasm; application/javascript js; }
        add_header Cache-Control "public, max-age=3600" always;
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /v1/tickets {
        limit_req zone=tlsnc_tickets burst=10 nodelay;
        proxy_pass http://tlsnc_notary;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/(info|health|v1/|\.well-known/tlsnc-notary\.json) {
        proxy_pass http://tlsnc_notary;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tlsnc_connection;
        proxy_buffering off;
        # L-tier sessions may run 10 minutes over slow uplinks.
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        client_max_body_size 64k;
    }
}
