[workspace]
members = [
    "crates/protocol",
    "crates/notary",
    "crates/client",
    "crates/verify",
    "crates/cli",
]
# Built separately with nightly (threads, build-std), see wasm/prover/build.sh.
exclude = ["wasm/prover"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jooray/tlsnotary-cashu"

[workspace.dependencies]
tlsnc-protocol = { path = "crates/protocol" }
tlsnc-client = { path = "crates/client" }
tlsnc-verify = { path = "crates/verify" }

# Upstream TLSNotary. One pinned revision for everything: builds are not
# wire-compatible with each other. main after v0.1.0-alpha.15, for the
# verifier-side bound on prover commitment ranges (#1196) and the prover
# stall fixes (#1202); bump TLSN_VERSION in crates/protocol and
# packages/client together with this.
tlsn = { git = "https://github.com/tlsnotary/tlsn", rev = "24b10ba21bf36c3fd3de709e7eccd8308bb64207" }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn", rev = "24b10ba21bf36c3fd3de709e7eccd8308bb64207" }
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn", rev = "24b10ba21bf36c3fd3de709e7eccd8308bb64207" }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn", rev = "24b10ba21bf36c3fd3de709e7eccd8308bb64207" }

cdk = { version = "0.18.2", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "0.18.2", default-features = false, features = ["wallet"] }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bincode = "1.3"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
