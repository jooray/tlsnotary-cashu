[package]
name = "tlsnc-wasm"
description = "Browser prover for tlsnotary-cashu: notarize, present and verify in WebAssembly"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Its own workspace: it needs nightly, build-std and atomics (see build.sh).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tlsnc-client = { path = "../../crates/client" }
tlsnc-verify = { path = "../../crates/verify" }
tlsnc-protocol = { path = "../../crates/protocol" }

console_error_panic_hook = "0.1"
futures = "0.3"
js-sys = "0.3"
parking_lot = { version = "0.12", features = ["nightly"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-spawn = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
rustls-pki-types = { version = "1.12", features = ["web"] }
web-sys = { version = "0.3", features = ["Worker"] }

[profile.release]
lto = true
opt-level = 3
panic = "abort"
codegen-units = 1
